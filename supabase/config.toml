project_id = "new-life"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "newlife://"
additional_redirect_urls = ["https://localhost:8081", "exp://127.0.0.1:8081"]
jwt_expiry = 3600
enable_signup = true

[functions.sync-push]
verify_jwt = true

[functions.sync-pull]
verify_jwt = true

[functions.ai-context-refresh]
verify_jwt = true

[functions.ai-coach]
verify_jwt = true

[functions.ai-action-confirm]
verify_jwt = true

[functions.smart-notifications-cron]
verify_jwt = false

